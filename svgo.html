<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Document</title>
    <link rel="stylesheet" href="./svgo.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <br />
    <br />
    <div style="font-size: 16px" id="rem-test">
      <label for="rootFontSize">RootFontSize:</label
      ><input id="rootFontSize" type="text" />
      <br />
      <button type="submit">update</button>
    </div>
    <div
      style="
        padding: 1rem 2rem;
        outline: 1px solid #bbb;
        margin: 1rem;
        display: inline-block;
      "
    >
      <span style="font-size: 4rem; outline: 1px solid #bbb">4rem</span>
    </div>

    <br />
    <table>
      <caption>
        Front-end web developer course 2021
      </caption>
      <thead>
        <tr>
          <th scope="col">\</th>
          <th scope="col">original</th>
          <th scope="col">optimize</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Render</th>
          <td class="render">Web accessibility</td>
          <td class="render">45</td>
        </tr>
        <tr>
          <th scope="row">Markup</th>
          <td class="markup">
            <pre>optimize Markup</pre>
          </td>
          <td class="markup">
            <pre>original Markup</pre>
          </td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th scope="row" colspan="2">
            <input type="file" id="fileInput" accept="*.svg" />
            <button>optimize</button>
          </th>
          <td>
            <button>download</button>
          </td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
