<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table {
        border-collapse: collapse;
        border: 2px solid rgb(140 140 140);
        font-family: sans-serif;
        font-size: 0.8rem;
        letter-spacing: 1px;
      }

      caption {
        caption-side: bottom;
        padding: 10px;
        font-weight: bold;
      }

      thead,
      tfoot {
        background-color: rgb(228 240 245);
      }

      th,
      td {
        border: 1px solid rgb(160 160 160);
        padding: 8px 10px;
      }

      td:last-of-type {
        text-align: center;
      }

      tbody > tr:nth-of-type(even) {
        background-color: rgb(237 238 242);
      }

      tfoot th {
        text-align: right;
      }

      tfoot td {
        font-weight: bold;
      }

      .content pre {
        max-width: 40vw;
        white-space: pre-wrap;
        text-align: left;
      }
    </style>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <br />
    <table>
      <caption>
        Front-end web developer course 2021
      </caption>
      <thead>
        <tr>
          <th scope="col">\</th>
          <th scope="col">original</th>
          <th scope="col">optimize</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Render</th>
          <td class="render">Web accessibility</td>
          <td class="render">45</td>
        </tr>
        <tr>
          <th scope="row">Markup</th>
          <td class="markup">
            <pre>optimize Markup</pre>
          </td>
          <td class="markup">
            <pre>original Markup</pre>
          </td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th scope="row" colspan="2">
            <input type="file" id="fileInput" accept="*.svg" />
            <button>optimize</button>
          </th>
          <td>
            <button>download</button>
          </td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
