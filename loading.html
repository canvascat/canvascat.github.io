<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
  <style>
    .spinner {
      --spinner-size: 30px;
      --spinner-color: #148fcc;
      --spinner-border-width: 4px;
      position: relative;
      animation: spinner-outer-rotate 2.91667s linear infinite;
      width: var(--spinner-size);
      height: var(--spinner-size);
    }

    .spinner-inner {
      position: relative;
      width: var(--spinner-size);
      height: var(--spinner-size);
      animation: spinner-sporadic-rotate 5.25s cubic-bezier(0.35, 0, 0.25, 1) infinite;
    }

    .spinner-left,
    .spinner-right {
      position: absolute;
      top: 0;
      width: calc(var(--spinner-size) / 2);
      height: var(--spinner-size);
      overflow: hidden;
    }

    .spinner-left {
      left: 0;
    }

    .spinner-right {
      right: 0;
    }

    .spinner-left::after,
    .spinner-right::after {
      content: "";
      position: absolute;
      top: 0;
      width: var(--spinner-size);
      height: var(--spinner-size);
      box-sizing: border-box;
      border: var(--spinner-border-width) solid var(--spinner-color);
      border-bottom-color: transparent;
      border-radius: 50%;
    }

    .spinner-left::after {
      left: 0;
      border-right-color: transparent;
      animation: spinner-left-wobble 1.3125s cubic-bezier(0.35, 0, 0.25, 1) infinite;
    }

    .spinner-right::after {
      right: 0;
      border-left-color: transparent;
      animation: spinner-right-wobble 1.3125s cubic-bezier(0.35, 0, 0.25, 1) infinite;
    }

    @keyframes spinner-outer-rotate {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(1turn);
      }
    }

    @keyframes spinner-sporadic-rotate {
      12.5% {
        transform: rotate(135deg);
      }

      25% {
        transform: rotate(270deg);
      }

      37.5% {
        transform: rotate(405deg);
      }

      50% {
        transform: rotate(540deg);
      }

      62.5% {
        transform: rotate(675deg);
      }

      75% {
        transform: rotate(810deg);
      }

      87.5% {
        transform: rotate(945deg);
      }

      100% {
        transform: rotate(3turn);
      }
    }

    @keyframes spinner-left-wobble {

      0%,
      100% {
        transform: rotate(130deg);
      }

      50% {
        transform: rotate(-5deg);
      }
    }

    @keyframes spinner-right-wobble {

      0%,
      100% {
        transform: rotate(-130deg);
      }

      50% {
        transform: rotate(5deg);
      }
    }
  </style>
  <style>
    button {
      white-space: nowrap;
      margin-bottom: 1rem;
    }

    main {
      padding-block: 30vh 100vh;
      text-align: center;
      margin-inline: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>

<script>
  function addLog(log) {
    // logs.innerHTML += `\n${log}`;
  }
  const now = () => Math.floor(Date.now() / 1000);
  const setupTime = now();
  let startTime = setupTime;
  function setup() {
    let lastTime = startTime;
    let fps = 0;
    const fpsList = [];
    window.requestAnimationFrame(function callback() {
      const current = now();
      if (current > lastTime) {
        lastTime = current;
        timeValue.textContent = current - startTime;

        if (current > startTime + 1) {
          fpsValue.textContent = fps;

          if (fps < 30) {
            addLog(`cost${current - startTime}s FPS < 30 (${fps})`);
          }
        }

        fps = 0;
      } else {
        fps++;
      }
      window.requestAnimationFrame(callback);
    });
  }
  setup();
  function addWrap() {
    const target = document.querySelector(".spinner");
    let parent = target.parentElement;
    Array.from({ length: 1000 }, () => document.createElement("div")).forEach(
      (wrap) => {
        parent.appendChild(wrap);
        parent = wrap;
      }
    );
    parent.appendChild(target);
  }

  // `*,*::after,*::before { box-sizing: inherit; animation-play-state: paused !important;}`
  function createStylesheet(textContent) {
    const stylesheet = document.createElement("style");
    stylesheet.textContent = textContent;
    document.head.appendChild(stylesheet);
    return stylesheet;
  }

  function toggleFactory(styleContent, html) {
    html = html || [
      `add <code>${styleContent}</code>`,
      `remove <code>${styleContent}</code>`,
    ];
    return function toggle(el) {
      startTime = now();
      if (toggle.reset) {
        toggle.reset();
      } else {
        const stylesheet = createStylesheet(styleContent);
        el.innerHTML = html[1];
        addLog(html[0]);
        toggle.reset = () => {
          stylesheet.remove();
          el.innerHTML = html[0];
          addLog(html[1]);
          toggle.reset = null;
        };
      }
    };
  }

  const forEvery = (style) => `*,*::after,*::before { ${style}}`;
  window.toggleInheritBoxSizing = toggleFactory(
    forEvery("box-sizing: inherit;")
  );
  window.toggleAnimation = toggleFactory(
    forEvery("animation-play-state: paused !important;"),
    ["pause", "play"]
  );
  window.toggleInheritBorderRadius = toggleFactory(
    forEvery("border-radius: inherit;")
  );
  window.toggleLockBoxSizing = toggleFactory(
    ".spinner, .spinner-inner { box-sizing: border-box !important; }",
    ["lock box-sizing", "unlock box-sizing"]
  );
</script>
