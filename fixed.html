<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>fixed test</title>
    <style>
      * {
        box-sizing: border-box;
      }
      header,
      footer {
        height: 40px;
        position: fixed;
        width: 100%;
        /* background: blanchedalmond; */
        background: rgba(255, 255, 255, 0.5);
        border: 2px solid blueviolet;
        backdrop-filter: blur(5px);
      }

      textarea,
      div[contenteditable="true"] {
        width: calc(100% - 2rem);
        margin-block: 40px;
        margin-inline: 1rem;
        display: block;
        border-radius: 0 !important;
        resize: both;
        border: 2px solid slategrey;
        min-height: 100px;
      }
      main {
        width: 100%;
        overflow: auto;
        height: 50vh;
        padding-inline: 1rem;
        margin: 0;
        border-bottom: 2px solid slategrey;
      }

      .fixed {
        display: inline-block;
        position: fixed;

        background: bisque;
        border: 2px solid seagreen;
        padding: 0.5rem 1rem;
        opacity: 0.6;
      }
      .fixed.bottom-left {
        bottom: 0;
        left: 0;
      }
      .fixed.bottom-right {
        bottom: 0;
        right: 0;
      }
      .fixed.top-right {
        top: 0;
        right: 0;
      }
    </style>
  </head>
  <body style="margin: 0">
    <header style="top: 0">header</header>
    <textarea rows="10"></textarea>

    <div contenteditable="true">
      <main></main>
      <p contenteditable="false">no delete</p>
      <br /><br /><br />
    </div>
    <div contenteditable="true"></div>
    <div contenteditable="true"></div>
    <footer style="bottom: 0">footer</footer>
    <div class="fixed bottom-right">bottom-right</div>
    <div class="fixed bottom-left">bottom-left</div>
    <div class="fixed top-right">top-right</div>
  </body>
  <script>
    // https://github.com/bokand/bokand.github.io/blob/b5d684e87ee23938433063d369f8c4d5a32c3a76/web_viewports_explainer.md#safari-2
    document.querySelector(
      "main"
    ).innerHTML += `<p>${navigator.appVersion}</p>`;
    if ("visualViewport" in window) {
      function fixedFactory(
        offset = () => visualViewport.offsetTop,
        selectors = ".fixed.top-right"
      ) {
        let latest = null;
        return () => {
          const current = offset();
          const dom = document.querySelector(selectors);
          if (!dom || current === latest) return;
          dom.style.transform = `translateY(${(latest = current)}px)`;
        };
      }

      const fixedBottomLeft = fixedFactory(
        () =>
          visualViewport.height - window.innerHeight + visualViewport.offsetTop,
        ".fixed.bottom-left"
      );
      const fixedBottomRight = fixedFactory(
        () => visualViewport.height - window.innerHeight,
        ".fixed.bottom-right"
      );
      const fixedTopRight = fixedFactory(
        () => visualViewport.offsetTop,
        ".fixed.top-right"
      );
      logFactory("test");
      function logFactory(name) {
        let key = null;
        return () => {
          fixedBottomLeft();
          fixedBottomRight();
          fixedTopRight();

          if (key !== null) {
            clearTimeout(key);
            key = null;
          }
          key = setTimeout(() => {
            key = null;
            document.querySelector("main").innerHTML += `<details>
      <summary>${name} | ${visualViewport.offsetTop} | ${
              window.innerHeight - visualViewport.height
            } | ====\></summary>
      <pre>${JSON.stringify(
        {
          "visualViewport.offsetTop": visualViewport.offsetTop,
          "visualViewport.pageTop": visualViewport.pageTop,
          "visualViewport.height": visualViewport.height,
          "window.innerHeight": window.innerHeight,
          "window.outerHeight": window.outerHeight,
        },
        null,
        2
      )}</pre>
    </details>`;
          }, 100);
        };
      }
      visualViewport.addEventListener("scroll", logFactory("viewport scroll"));
      visualViewport.addEventListener("resize", logFactory("viewport resize"));
      window.addEventListener("resize", logFactory("window resize"));
      // window.addEventListener("scroll", logFactory("window scroll"));
    }
  </script>
</html>
