<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>fixed test</title>
    <style>
      @property --vh {
        syntax: "<length>";
        inherits: true;
        initial-value: 100vh;
      }
      @property --vw {
        syntax: "<length>";
        inherits: true;
        initial-value: 100vw;
      }
      @property --dvh {
        syntax: "<length>";
        inherits: true;
        initial-value: 100dvh;
      }
      @property --dvw {
        syntax: "<length>";
        inherits: true;
        initial-value: 100dvw;
      }
      :root {
        --w: tan(atan2(var(--vw), 1px));
        --h: tan(atan2(var(--vh), 1px));
        --dw: tan(atan2(var(--dvw), 1px));
        --dh: tan(atan2(var(--dvh), 1px));
      }

      * {
        box-sizing: border-box;
      }

      body::after {
        counter-reset: w var(--w) h var(--h) dw var(--dw) dh var(--dh);
        position: fixed;
        inset: 0;
        width: fit-content;
        height: fit-content;
        margin: auto;
        content: "w:" counter(w) " h:" counter(h) " dw:" counter(dw) " dh:"
          counter(dh);
        background: rgba(143, 142, 142, 0.8);
        pointer-events: none;
      }

      #layoutViewport {
        position: fixed;
        width: 100%;
        height: 100%;
        visibility: hidden;
      }
      header,
      footer {
        height: 40px;
        position: fixed;
        width: 100%;
        /* background: blanchedalmond; */
        background: rgba(255, 255, 255, 0.5);
        border: 2px solid blueviolet;
        backdrop-filter: blur(5px);
      }

      textarea,
      div[contenteditable="true"] {
        width: calc(100% - 2rem);
        margin-block: 40px;
        margin-inline: 1rem;
        display: block;
        border-radius: 0 !important;
        resize: both;
        border: 2px solid slategrey;
        min-height: 400px;
      }
      main {
        width: 100%;
        overflow: auto;
        height: 50vh;
        padding-inline: 1rem;
        margin: 0;
        border-bottom: 2px solid slategrey;
      }

      .fixed {
        display: inline-block;
        position: fixed;

        background: bisque;
        border: 2px solid seagreen;
        padding: 0.5rem 1rem;
        opacity: 0.6;
      }
      .fixed.bottom-left {
        bottom: 0;
        left: 0;
      }
      .fixed.bottom-right {
        bottom: 0;
        right: 0;
      }
      .fixed.top-left {
        top: 0;
        left: 0;
      }
      .fixed.top-right {
        top: 0;
        right: 0;
      }
    </style>
  </head>
  <body style="margin: 0">
    <div id="layoutViewport"></div>
    <header style="top: 0">header</header>
    <textarea rows="10"></textarea>

    <div contenteditable="true" id="mainWrap">
      <main></main>
      <p contenteditable="false">no delete</p>
      <br /><br /><br />
    </div>
    <div contenteditable="true"></div>
    <div contenteditable="true"></div>
    <footer style="bottom: 0">footer</footer>
    <div class="fixed bottom-right">bottom-right</div>
    <div class="fixed bottom-left">bottom-left</div>
    <div class="fixed top-left">top-right</div>
    <div class="fixed top-right">top-right</div>
  </body>
  <script>
    // https://github.com/bokand/bokand.github.io/blob/b5d684e87ee23938433063d369f8c4d5a32c3a76/web_viewports_explainer.md#safari-2
    document.querySelector(
      "main"
    ).innerHTML += `<p>${navigator.appVersion}</p>`;
    const layoutViewport = document.querySelector("#layoutViewport");
    if ("visualViewport" in window) {
      let layoutViewportHeight = layoutViewport.getBoundingClientRect().height;
      function fixedFactory(
        offset = () => visualViewport.offsetTop,
        selectors = ".fixed.top-right"
      ) {
        let latest = null;
        return () => {
          const current = offset();
          const dom = document.querySelector(selectors);
          if (!dom || current === latest) return;
          dom.style.transform = `translateY(${(latest = current)}px)`;
        };
      }

      const fixedBottomLeft = fixedFactory(
        () =>
          visualViewport.height -
          layoutViewportHeight +
          visualViewport.offsetTop,
        ".fixed.bottom-left"
      );
      const fixedBottomRight = fixedFactory(
        () => visualViewport.height - layoutViewportHeight,
        ".fixed.bottom-right"
      );
      const fixedTopRight = fixedFactory(
        () => visualViewport.offsetTop,
        ".fixed.top-right"
      );
      const fixedTopLeft = fixedFactory(
        () => visualViewport.offsetTop,
        ".fixed.top-left"
      );
      // logFactory("test");
      function logFactory(name) {
        let key = null;
        return () => {
          fixedBottomLeft();
          fixedBottomRight();
          fixedTopRight();
          fixedTopLeft();

          if (key !== null) {
            clearTimeout(key);
            key = null;
          }
          key = setTimeout(() => {
            key = null;
            document.querySelector("main").innerHTML += `<details>
      <summary>${name} | ${~~layoutViewportHeight} | ${~~window.innerHeight} | ${~~visualViewport.offsetTop} | ${~~visualViewport.height} | ====\></summary>
      <pre>${JSON.stringify(
        {
          "visualViewport.offsetTop": visualViewport.offsetTop,
          "visualViewport.height": visualViewport.height,
          "window.innerHeight": window.innerHeight,
          layoutViewportHeight: layoutViewportHeight,
        },
        null,
        2
      )}</pre>
    </details>`;
          }, 100);
        };
      }
      visualViewport.addEventListener(
        "scroll",
        logFactory("visual viewport scroll")
      );
      visualViewport.addEventListener(
        "resize",
        logFactory("visual viewport resize")
      );
      const handleLayoutResize = logFactory("layout viewport resize");
      const observer = new ResizeObserver((entries) => {
        const entry = entries[0];
        if (!entry) return;
        layoutViewportHeight = entry.contentRect.height;
        handleLayoutResize(entry.contentRect.height);
      });
      observer.observe(layoutViewport);
    }

    new IntersectionObserver(
      (entries) => {
        for (const entry of entries) {
          document.querySelector(
            ".fixed.top-left"
          ).innerHTML = `isIntersecting: ${entry.isIntersecting}<br /> intersectionRatio: ${entry.intersectionRatio}`;
        }
      },
      { threshold: [0, 0.25, 0.5, 0.75, 1] }
    ).observe(document.querySelector("#mainWrap"));
  </script>
</html>
