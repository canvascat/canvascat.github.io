<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>fixed test</title>
    <style>
      * {
        box-sizing: border-box;
      }
      header,
      footer {
        height: 40px;
        position: fixed;
        width: 100%;
        /* background: blanchedalmond; */
        background: rgba(255, 255, 255, 0.5);
        border: 2px solid blueviolet;
        backdrop-filter: blur(5px);
      }

      textarea,
      div[contenteditable="true"] {
        width: calc(100% - 2rem);
        margin-block: 40px;
        margin-inline: 1rem;
        display: block;
        border-radius: 0 !important;
        resize: both;
        border: 2px solid slategrey;
        min-height: 100px;
      }
      main {
        width: 100%;
        overflow: auto;
        height: 50vh;
        padding-inline: 1rem;
        margin: 0;
        border-bottom: 2px solid slategrey;
      }
      .fixedBottom,
      .fixedTop {
        display: inline-block;
        position: fixed;

        background: bisque;
        border: 2px solid seagreen;
        padding: 0.5rem 1rem;
        opacity: 0.6;
        right: 0;
      }
      .fixedBottom {
        bottom: 0;
      }
      .fixedTop {
        top: 0;
      }
    </style>
  </head>
  <body style="margin: 0">
    <header style="top: 0">header</header>
    <textarea rows="10"></textarea>

    <div contenteditable="true">
      <main contenteditable="false"></main>
      <p contenteditable="false">no delete</p>
      <br /><br /><br />
    </div>
    <div contenteditable="true"></div>
    <div contenteditable="true"></div>
    <footer style="bottom: 0">footer</footer>
    <div class="fixedBottom">fixed bottom</div>
    <div class="fixedTop">fixedTop</div>
  </body>
  <script>
    // https://github.com/bokand/bokand.github.io/blob/b5d684e87ee23938433063d369f8c4d5a32c3a76/web_viewports_explainer.md#safari-2
    document.querySelector(
      "main"
    ).innerHTML += `<p>${navigator.appVersion}</p>`;
    if ("visualViewport" in window) {
      let bottomOffset = 0;
      let topOffset = 0;

      function logFactory(name) {
        let key = null;
        return () => {
          if (visualViewport.height - window.innerHeight !== bottomOffset) {
            document.querySelector(
              ".fixedBottom"
            ).style.transform = `translateY(${(bottomOffset =
              visualViewport.height - window.innerHeight)}px)`;
          }
          if (visualViewport.offsetTop !== topOffset) {
            document.querySelector(
              ".fixedTop"
            ).style.transform = `translateY(${(topOffset =
              visualViewport.offsetTop)}px)`;
          }

          if (key !== null) {
            clearTimeout(key);
            key = null;
          }
          key = setTimeout(() => {
            key = null;
            document.querySelector("main").innerHTML += `<details>
      <summary>${name} | ${visualViewport.offsetTop} | ${
              window.innerHeight - visualViewport.height
            } | ====\></summary>
      <pre>${JSON.stringify(
        {
          "visualViewport.offsetTop": visualViewport.offsetTop,
          "visualViewport.pageTop": visualViewport.pageTop,
          "visualViewport.height": visualViewport.height,
          "window.innerHeight": window.innerHeight,
          "window.outerHeight": window.outerHeight,
        },
        null,
        2
      )}</pre>
    </details>`;
          }, 100);
        };
      }
      visualViewport.addEventListener(
        "scroll",
        logFactory("visualViewportScroll")
      );
      visualViewport.addEventListener(
        "resize",
        logFactory("visualViewportResize")
      );
    }
  </script>
</html>
